allowed_origins:
  - http://localhost:8000
runner_timeout_seconds: 30
max_elements: 200

# Model configuration (Person 3). Secrets never go here: API keys are read
# from environment variables or a local, git-ignored .env file.
model:
  # groq | gemini | ollama | mock   (mock = offline, deterministic, for tests only)
  provider: groq
  # Tried in order when the main provider fails (network error, rate limit,
  # timeout, missing key). Use [] to disable.
  #   ollama = local open-source model; needs Ollama running on this machine and
  #            is skipped quickly when it is not.
  #   mock   = offline last resort. Its replies are labelled "[MOCK ...]" and are
  #            never valid evidence (model.cli refuses to save them).
  fallbacks: [ollama, mock]
  temperature: 0.2
  # Reasoning models (gpt-oss) spend part of this budget on hidden reasoning.
  max_output_tokens: 1500
  timeout_seconds: 60
  # Truncate long page strings before they reach the prompt.
  max_field_chars: 200
  providers:
    groq:
      # Open-weights model; Groq retired the Llama 3.x models in 2026.
      model: openai/gpt-oss-20b
      reasoning_effort: low
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
    gemini:
      model: gemini-2.0-flash
      base_url: https://generativelanguage.googleapis.com/v1beta
      api_key_env: GEMINI_API_KEY
    ollama:
      model: llama3.2:3b
      base_url_env: OLLAMA_BASE_URL
      base_url: http://localhost:11434
    mock:
      model: mock-grounded-v1
